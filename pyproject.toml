[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-severity-ml"
version = "0.1.0"
description = "ML-assisted IT incident severity prediction (POC to production-ready skeleton)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
demo = ["streamlit>=1.30"]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
isp = "incident_severity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]
